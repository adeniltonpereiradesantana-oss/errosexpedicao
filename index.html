<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Erros de Expedição</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d4f91; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f6f8; }
    .carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="carregando" id="carregando">Carregando Controle de Erros…</div>
  <iframe id="app" title="Controle de Erros de Expedição" allow="clipboard-write"></iframe>
  <script>
    // ID da implantação: o trecho entre /macros/s/ e /exec do link do sistema
    var ID_IMPLANTACAO = 'AKfycbxDU1C70Fr2kT4o1HOxyRZooYjRbdGUULkQR12KAwBRFpaOtMfbE3TGD3eNtWSPbYM';
    var app = document.getElementById('app');
    app.onload = function () { document.getElementById('carregando').style.display = 'none'; };
    app.src = 'https://script.google.com/macros/s/' + ID_IMPLANTACAO + '/exec' + (location.search || '');
  </script>
</body>
</html>
